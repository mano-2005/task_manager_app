name: flutter_application_1
description: "Task Manager App with Firebase and SharedPreferences"
publish_to: 'none'

version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Local storage
  shared_preferences: ^2.5.5

  # Firebase core (required for initialization)
  firebase_core: ^3.1.0

  # Cloud Firestore (for task syncing)
  cloud_firestore: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true